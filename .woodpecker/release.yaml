# Tag and release. Replaces the GitHub Actions release job (release.yml).
# It runs only on a push to main, after the ci workflow passes.
# Secret codeman_release_token: GitHub token with contents write on shabo/codeman.
labels:
  platform: linux/amd64
when:
  - event: push
    branch: main
depends_on:
  - ci
steps:
  - name: tag-and-release
    image: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    environment:
      GH_TOKEN:
        from_secret: codeman_release_token
    commands:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates curl git jq >/dev/null
        ver="$$(tr -d '[:space:]' < VERSION)"
        if [[ ! "$$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "VERSION must be X.Y.Z, got: $$ver" >&2
          exit 1
        fi
        tag="v$$ver"
        git fetch -q --tags origin
        if git rev-parse -q --verify "refs/tags/$$tag" >/dev/null; then
          echo "Tag already exists: $$tag"
          exit 0
        fi
        git config user.name "woodpecker-ci"
        git config user.email "woodpecker-ci@users.noreply.github.com"
        git tag -a "$$tag" -m "$$tag" "$$CI_COMMIT_SHA"
        auth="$$(printf 'x-access-token:%s' "$$GH_TOKEN" | base64 -w0)"
        git -c credential.helper= -c "http.https://github.com/.extraheader=Authorization: Basic $$auth" \
          push https://github.com/shabo/codeman.git "refs/tags/$$tag"
        jq -n --arg t "$$tag" '{tag_name:$$t,name:$$t,generate_release_notes:true}' \
          | curl -fsS -o /dev/null -X POST \
              -H "Authorization: Bearer $$GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/shabo/codeman/releases -d @-
        echo "Released $$tag"
