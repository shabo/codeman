# Shell checks. Moved from GitHub Actions without a change to the checks.
# The tag and release job stays on GitHub Actions: it needs a write credential that does not exist yet.
labels:
  platform: linux/amd64
when:
  - event: pull_request
  - event: push
    branch: main
steps:
  - name: shell
    image: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    commands:
      - apt-get update -qq
      - apt-get install -qq -y shellcheck >/dev/null
      - bash -n bin/codeman
      - shellcheck -x bin/codeman
